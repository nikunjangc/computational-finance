    bias: bearish
    keywords:
      - tariff
      - tariffs
      - trade war
      - import duty
      - sanctions
      - reshoring
      - trade deal
    tickers:
      - {symbol: CAT, name: "Caterpillar"}
      - {symbol: DE,  name: "Deere & Co"}
      - {symbol: FXI, name: "China Large-Cap ETF"}
      - {symbol: WMT, name: "Walmart"}

# ---------------------------------------------------------------------
# Global sentiment lexicons used to infer bullish / bearish direction
# from the words surrounding a matched keyword.
# ---------------------------------------------------------------------
sentiment:
  bullish:
    - up
    - rise
    - rises
    - rising
    - surge
    - soar
    - rally
    - boom
    - boost
    - support
    - invest
    - investing
    - investment
    - grow
    - growth
    - expand
    - cut          # "rate cut" is bullish for risk assets
    - cuts
    - stimulus
    - bullish
    - strong
    - record
    - back         # "get behind / back"
    - winner
    - winners
    - "go up"
    - skyrocket
    - moon
  bearish:
    - down
    - fall
    - falls
    - falling
    - drop
    - plunge
    - crash
    - slump
    - weak
    - weakness
    - hike          # "rate hike" pressures risk assets
    - hikes
    - tighten
    - tightening
    - ban
    - banned
    - restrict
    - restriction
    - sanction
    - tax
    - bearish
    - sell
    - selloff
    - recession
    - slowdown
    - loser
    - losers

# Negation words that flip the inferred direction within a short window.
negations:
  - not
  - "no"
  - never
  - "won't"
  - "wont"
  - "doesn't"
  - "doesnt"
  - avoid
  - against
