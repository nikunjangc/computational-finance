name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # The test suite hard-depends only on PyYAML; requests/anthropic/redis/
        # Pillow are imported lazily and stubbed in tests, so they aren't needed.
        run: python -m pip install --upgrade pip PyYAML

      - name: Run stock_tracker test suite
        run: python tests/test_tracker.py
